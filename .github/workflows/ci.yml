name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create .env from the example file
        run: cp .env.example .env
      - name: Fail if a model change has no migration
        run: docker compose run --rm web python manage.py makemigrations --check --dry-run
      - name: Fail if the OpenAPI schema has warnings
        run: docker compose run --rm web python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml
      - name: Fail if production settings have deploy warnings
        run: >
          docker compose run --rm
          -e DJANGO_DEBUG=0
          -e DJANGO_SECRET_KEY=$(openssl rand -base64 48)
          -e DJANGO_ALLOWED_HOSTS=example.com
          web python manage.py check --deploy --fail-level WARNING
      - name: Run tests
        run: docker compose run --rm web pytest
      - name: Back up the database and restore it into an empty one
        run: |
          docker compose run --rm web python manage.py migrate --noinput
          docker compose exec -T db createdb -U checkin restore_check
          pg="docker run --rm --network event-checkin-platform_default -v $PWD:/w -w /w postgres:17"
          $pg env DATABASE_URL=postgresql://checkin:change-me@db/checkin bash scripts/backup.sh backups
          $pg env DATABASE_URL=postgresql://checkin:change-me@db/restore_check bash scripts/restore.sh backups/*.dump
          count() { docker compose exec -T db psql -U checkin -d "$1" -tAc "select count(*) from django_migrations"; }
          src=$(count checkin)
          dst=$(count restore_check)
          echo "migrations in source: $src, restored: $dst"
          test "$src" -gt 0 && test "$src" = "$dst"
      - name: Build the production image
        run: docker build -t checkin .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create .env from the example file
        run: cp .env.example .env
      - name: Fail if a model change has no migration
        run: docker compose run --rm web python manage.py makemigrations --check --dry-run
      - name: Fail if the OpenAPI schema has warnings
        run: docker compose run --rm web python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml
      - name: Fail if production settings have deploy warnings
        run: >
          docker compose run --rm
          -e DJANGO_DEBUG=0
          -e DJANGO_SECRET_KEY=$(openssl rand -base64 48)
          -e DJANGO_ALLOWED_HOSTS=example.com
          web python manage.py check --deploy --fail-level WARNING
      - name: Run tests
        run: docker compose run --rm web pytest
      - name: Build the production image
        run: docker build -t checkin .


  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build